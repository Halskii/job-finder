# job-finder configuration template.
# Copy this file to config.yaml (which is git-ignored, so your settings stay private) and edit it.

min_pay: 0                # annual USD. Postings with a KNOWN max below this are dropped; unknown pay is kept. 0 turns the filter off.
max_age_days: 30          # drop postings older than this (when the posting date is known)
us_only: true             # drop postings whose location looks outside the US

# Locations to exclude. A posting is dropped only if EVERY location it lists matches, so
# "Denver, CO | Remote - US" is kept (you could still take the remote option).
# Whole-word, case-insensitive; two-letter state codes must be capitalized. Leave the list empty to turn this off.
exclude_locations: []
#  - Florida
#  - FL
crawl_every_days: 30    # the web app looks for new company boards (for everyone's titles) this often. 0 = only when you run `python main.py crawl --add`
fetch_every_hours: 0     # the web app reads every source for all users this often (24 = daily). 0 = only when you run `python main.py fetch`
keep_postings_days: 14   # postings no source has listed for this long are deleted (unless a user has them as one of their jobs)
store_max_age_days: 90   # postings clearly older than this are not stored at all
# Paid calls (scoring, resume tailoring, interview prep, resume reading) allowed per day: for one person, and for the whole site together.
# Scoring's per-person limit is scoring.max_per_user_per_day. Read on every check, so edits apply at once. paused: true stops them all (a kill switch).
limits:
  per_user_per_day: {tailor: 6, tips: 12, analyze: 6}
  all_users_per_day: {score: 4000, tailor: 100, tips: 300, analyze: 100}
  paused: false
request_delay: 0.4        # seconds between HTTP requests (be polite to job boards)

profile_model: claude-sonnet-5-5   # used by `main.py profile` to read resume.pdf
tailor_model: claude-fable-5-1     # used by the viewer's "Tailor resume" and "Cover letter" buttons
onboard_model: claude-haiku-5-5    # used by the profile page to suggest job titles from a resume (the facts come from profile_model)
tips_model: claude-haiku-5-5       # used by the "Interview prep" button on a job's page
tips_web_search: true              # let it search the web for what candidates report (about 1 cent per search, plus the extra tokens)

scoring:
  model: claude-haiku-5-5            # cheap first pass (it thinks briefly at low effort, see scorer.py); claude-sonnet-5-5 costs about 17 times as much
  max_per_run: 40                    # cap LLM calls per `main.py run` to control cost
  initial_batch: 50                  # the web app scores this many of a user's best matches at once, so there is something to read straight away
  batch_size: 50                     # then keeps going in background batches of this size
  max_per_user_per_day: 400          # paid scoring calls one user can use in a day; the rest wait until tomorrow
  workers: 8                          # scoring calls made at the same time (lower this if you see rate-limit errors)
  report_min_score: 60               # only show jobs scoring at least this in the report
  report_size: 1000
  price_per_million_tokens: {input: 0.10, output: 0.50}   # USD for the scoring model above; edit if prices change

# Job titles to look for. Level markers (I, II, III, Associate, Junior) are stripped automatically,
# so "Software Engineer I" also matches a posting titled just "Software Engineer". Replace these with your own.
titles:
  - Software Engineer I
  - Software Engineer II
  - Associate Software Engineer
  - Junior Software Engineer
  - Backend Software Engineer
  - Full Stack Software Engineer
  - Platform Engineer
  - Cloud Engineer
  - DevOps Engineer
  - Site Reliability Engineer
  - Data Engineer
  - Machine Learning Engineer
  - AI Engineer
  - Application Developer

# Titles containing any of these words are dropped (adjust to your experience level).
exclude_title_words: [senior, sr, staff, principal, lead, manager, director, head, vp, intern, internship, architect]

# Search words for Workday sites (they have a free-text title search). 'auto' derives them from `titles` above
# (level markers like I / II / III / Associate / Junior are dropped), so you only edit one list. You can also give
# your own list, or mix: [auto, devops, "machine learning"] adds extra words to the derived ones.
workday_search_terms: auto
workday_max_pages: 3
workday_workers: 16       # Workday sites read at the same time (each site still gets one request at a time)
detail_workers: 16        # servers asked for full postings at the same time (same rule: one request at a time per server)
fetch_workers: 8          # Greenhouse / Lever / Ashby / Gem / ... boards read at the same time
crawl_workers: 16         # boards checked at the same time by `main.py crawl`

# Job boards. Add any company that uses these systems (or let `main.py discover` / `main.py workday-add` do it for you):
#   Greenhouse:      boards.greenhouse.io/<slug> or job-boards.greenhouse.io/<slug>
#   Lever:           jobs.lever.co/<slug>
#   Ashby:           jobs.ashbyhq.com/<slug>
#   SmartRecruiters: jobs.smartrecruiters.com/<CompanyId>
#   Workday:         https://<host>/en-US/<site>/...   ->  {name, host, tenant, site}
# Slugs that don't exist are skipped with a warning.
sources:
  greenhouse: [anthropic, databricks, stripe, airbnb, cloudflare, datadog, gitlab, coinbase, figma, robinhood, samsara, twilio, okta, mongodb, elastic]
  lever: [palantir, spotify]
  ashby: [openai, ramp, notion, linear, vercel]
  smartrecruiters: []
  workday: []
  # Example Workday entry:
  #  - {name: Vanguard, host: vanguard.wd5.myworkdayjobs.com, tenant: vanguard, site: vanguard_external}

# Turn a whole platform off by setting it to false (a platform not listed here is on). Its boards stay in your lists and
# are skipped, with a note in the run output. Aggregator feeds and government sources have their own `enabled:` below.
platforms:
  greenhouse: true
  lever: true
  ashby: true
  smartrecruiters: false   # api.smartrecruiters.com/robots.txt keeps programs out (this is forced off in the code too)
  workable: true
  recruitee: true
  bamboohr: true
  rippling: true
  gem: true
  personio: true
  workday: true

# Aggregator feeds, each on when `enabled: true`. Each is fetched at most once per `min_hours` (default 6; Remotive asks for
# at most ~4 requests a day). Job links go to the feed's own site, as their terms require. Remotive details:
# Its job links go to remotive.com, as their terms require. Categories: software-development, devops,
# artificial-intelligence, engineering, information-technology, data, qa.
feeds:
  remotive:
    enabled: true
    min_hours: 6
    categories: [software-development, devops, artificial-intelligence]
  remoteok:                  # remoteok.com; job links go to remoteok.com, as their terms require
    enabled: true
  weworkremotely:            # RSS feeds; categories are the names in weworkremotely.com/categories/<name>
    enabled: true
    categories: [remote-programming-jobs, remote-devops-sysadmin-jobs, remote-back-end-programming-jobs]
  jobicy:                    # searched with your title words (override with `terms: [...]`); US-eligible jobs only
    enabled: true
  workingnomads:
    enabled: true
  himalayas:                 # searched with your title words, 20 results a page
    enabled: true
    pages: 2
  adzuna:                    # large US aggregator; needs free keys in .env (ADZUNA_APP_ID, ADZUNA_APP_KEY)
    enabled: false
    min_hours: 12
    pages: 2
  jooble:                    # aggregator; needs a free key in .env (JOOBLE_API_KEY)
    enabled: false
    min_hours: 12
    pages: 2
  hackernews:                # the monthly "Ask HN: Who is hiring?" threads, one job per top-level comment
    enabled: true
    threads: 2

# Government job titles, used only for government sources. They are titled differently from tech companies
# (for example Texas 'Programmer III' or federal 'IT Specialist (APPSW)'). Level markers are optional.
gov_titles:
  - Programmer
  - Programmer Analyst
  - Java Developer
  - Software Developer
  - Application Developer
  - Web Developer
  - Developer
  - IT Specialist
  - Information Technology Specialist
  - Computer Scientist
  - Computer Engineer

# Extra search words for the retailers (Lowe's, Home Depot, CVS and the others under `retailers:` below, and any Workday site added with --retail),
# part of the shared fetch. Retailers hire for stores, warehouses and head offices alike, so these cover the common jobs of each kind. Everyone's own
# titles are searched there too, so a person who saves "Pharmacy Technician" or "Barista" gets those without this list. Level markers are ignored.
retail_titles:
  - Cashier
  - Sales Associate
  - Customer Service Associate
  - Customer Service Representative
  - Stocker
  - Store Manager
  - Assistant Store Manager
  - Department Manager
  - Shift Supervisor
  - Team Lead
  - Team Member
  - Pharmacy Technician
  - Pharmacist
  - Warehouse Associate
  - Forklift Operator
  - Order Selector
  - Delivery Driver
  - Truck Driver
  - Merchandiser
  - Loss Prevention
  - Fulfillment Associate
  - Receiver
  - Maintenance Technician
  - Automotive Technician
  - Cook
  - Barista
  - Buyer
  - Merchandise Planner
  - Financial Analyst
  - Accountant
  - Recruiter
  - Marketing Specialist
  - Supply Chain Analyst
  - Store Planner

# Government sources, on by default. Set enabled: false to turn one off.
#  usajobs: the federal API. Needs a free key: add USAJOBS_API_KEY and USAJOBS_EMAIL (the email the key was issued to)
#           to .env. Without them it is skipped with a note.
#  texas_hhs: careers.hhs.texas.gov (HHSC, DFPS, DSHS). No API exists, so the public search pages are read.
#  florida: jobs.myflorida.com (State of Florida agencies). No API exists, so the public search pages are read.
#  vermont: careers.vermont.gov (State of Vermont). Same career site software as Florida.
#  new_york: statejobsny.com (State of New York civil service). The public vacancy table is read; it lists every posting, so there are no search words.
#  maryland, connecticut, delaware: jobapscloud.com/MD, /CT and /DE (JobAps). The home page lists every current recruitment, so there are no search words.
#  arizona, missouri, wisconsin, massachusetts, montana, utah, kentucky, south_dakota, california, kansas, minnesota, north_dakota, tennessee: each state's own job site. The whole list is read (Arizona waits 5 seconds between pages, as its robots.txt asks).
#  indiana, arkansas, illinois: SuccessFactors career sites, searched like Florida and Texas.
government:
  usajobs:
    enabled: true
    keywords: [software developer, software engineer, IT specialist, programmer, devops, cloud engineer]
    pages: 2
  texas_hhs:
    enabled: true
    search_terms: [developer, programmer, software, engineer, devops]
    pages: 2
  florida:
    enabled: true
    search_terms: [developer, programmer, software, engineer, devops]
    pages: 2
  vermont:
    enabled: true
    search_terms: [developer, programmer, software, engineer, devops]
    pages: 2
  new_york:
    enabled: true
  maryland:
    enabled: true
  connecticut:
    enabled: true
  delaware:
    enabled: true
  indiana:
    enabled: true
    search_terms: [developer, programmer, software, engineer, devops]
    pages: 2
  arkansas:
    enabled: true
    search_terms: [developer, programmer, software, engineer, devops]
    pages: 2
  illinois:
    enabled: true
    search_terms: [developer, programmer, software, engineer, devops]
    pages: 2
  arizona:
    enabled: true
  missouri:
    enabled: true
  wisconsin:
    enabled: true
  massachusetts:
    enabled: true
  montana:
    enabled: true
  utah:
    enabled: true
  kentucky:
    enabled: true
  south_dakota:
    enabled: true
  california:
    enabled: true
  kansas:
    enabled: true
  minnesota:
    enabled: true
  north_dakota:
    enabled: true
  tennessee:
    enabled: true

# Retailer career sites, on by default. Set enabled: false to turn one off. Each is searched with the same title words as Workday (workday_search_terms) plus retail_titles above,
# because a retailer lists thousands of store jobs next to a few tech roles; `search_terms:` here replaces those words and `pages:` is how many
# result pages (ten jobs each) are read per word.
#  lowes, cvs, tjx, dollartree, kohls, familydollar, fivebelow, gianteagle, oreilly, advanceauto, chewy, flooranddecor, academy, basspro (Cabela's too),
#  michaels, wawa, circlek: each retailer's own career site, all on Phenom. Their robots.txt files allow the search and job pages. `pages:` is how many
#  result pages (about ten jobs each) are read per search word; store jobs are plentiful, so a word like "cashier" has more than any page count reads.
#  Oracle Recruiting Cloud sites (albertsons incl. Safeway, Vons and Jewel-Osco; kroger incl. Fred Meyer; dollargeneral, macys, bloomingdales, staples,
#  sherwinwilliams, autozone, sallybeauty, americaneagle incl. Aerie; williamssonoma incl. Pottery Barn and West Elm; athome, warbyparker): `pages:` is
#  result pages of 200, and a few are plenty because the best matches come first. Albertsons waits 10 seconds between requests, as its site asks.
#  Jibe sites (sprouts, ulta, jcpenney, petsmart, costco, heb, footlocker, sheetz): each asks for 5 seconds between requests, so a run reads the first
#  hundred matches of each search word within a request budget; tech and corporate jobs come out complete, a very common word like "cashier" only in part.
#  SuccessFactors sites (tractorsupply, sephora, adidas, underarmour), and sites that list every job in a sitemap (gap incl. Old Navy, Banana Republic and
#  Athleta; nike, napa, bathandbodyworks, urbn incl. Anthropologie and Free People; ross, lidl, freshmarket, wayfair, ikea, containerstore, seveneleven,
#  loves, pilot, publix, walgreens): `pages:` does not apply. The sitemap sites keep the addresses holding a search word and read a job's page only when
#  someone's search selects it.
#  One-off sites: ahold (Food Lion, Giant Food, Stop & Shop, Hannaford), dillards, victoriassecret, hobbylobby, harborfreight.
#  Retailers on Workday (Target, Nordstrom, Hy-Vee, BJ's, Meijer, Petco, Dick's, Signet and others) are added with deploy/add-retailer-boards.sh.
#  TJX covers T.J. Maxx, Marshalls and HomeGoods, and lists jobs worldwide (the location settings drop the others).
#  homedepot: careers.homedepot.com. Its job sitemap lists every posting with the title in the address, so the addresses holding one of the search
#             words are picked and only those pages are read (`pages:` does not apply).
retailers:
  homedepot:
    enabled: true
  lowes:
    enabled: true
    pages: 20
  cvs:
    enabled: true
    pages: 20
  tjx:
    enabled: true
