# job-finder configuration. Edit freely.

min_pay: 80000            # annual USD. Postings with a KNOWN max below this are dropped; unknown pay is kept.
max_age_days: 30          # drop postings older than this (when the posting date is known)
us_only: true             # drop postings whose location looks outside the US
request_delay: 0.4        # seconds between HTTP requests (be polite to job boards)

profile_model: claude-sonnet-5-5   # used by `main.py profile` to read resume.pdf
exclude_locations:
scoring:
  model: claude-haiku-4-5-20251001   # cheap first pass; switch to claude-sonnet-5-5 for deeper analysis
  max_per_run: 40                    # cap LLM calls per run to control cost
  report_min_score: 60               # only show jobs scoring at least this in the report
  report_size: 25
  price_per_million_tokens: {input: 1.0, output: 5.0}   # USD for the scoring model above; edit if prices change

# Titles from filter.txt. Level markers (I, II, III, Associate, Junior) are stripped automatically,
