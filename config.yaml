# Titles containing any of these words are dropped (you have ~3 years of experience).
exclude_title_words: [senior, sr, staff, principal, lead, manager, director, head, vp, intern, internship, architect]

# Search words used for Workday sites (they have a free-text title search).
workday_search_terms: ["software engineer", "platform engineer", "devops", "cloud engineer", "ai engineer", "machine learning", "site reliability", "automation engineer"]
workday_max_pages: 3

# Job boards. Add any company that uses these systems:
#   Greenhouse: boards.greenhouse.io/<slug> or job-boards.greenhouse.io/<slug>
#   Lever:      jobs.lever.co/<slug>
#   Ashby:      jobs.ashbyhq.com/<slug>
# Slugs that don't exist are skipped with a warning.
sources:
  greenhouse: [anthropic, databricks, stripe, airbnb, cloudflare, datadog, gitlab, coinbase, figma, robinhood, samsara, twilio, okta, mongodb, elastic]
  lever: [palantir, spotify, plaid]
  ashby: [openai, ramp, notion, linear, vercel]
  workday:
    - {name: Vanguard, host: vanguard.wd5.myworkdayjobs.com, tenant: vanguard, site: vanguard_external}
    - {name: Alignment Health, host: alignmenthealthcare5.impl-wd12.myworkdayjobs.com, tenant: alignmenthealthcare5, site: ahc_external}
