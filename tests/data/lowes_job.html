<script type="text/javascript">phApp.ddo = {"jobDetail": {"status": 200, "data": {"job": {"jobId": "JR-02671814", "reqId": "JR-02671814", "title": "Frontend Software Engineer - Frameworks & Dev Platforms", "description": "<p><b>Innovate in Charlotte</b></p><p></p><p>Thank you for dedicating your time and talent to Lowe\u2019s. \u00a0We want to give you more opportunities to learn and grow, so if you find a position you\u2019re interested in below, we encourage you to apply!</p><p></p><p></p><h2><b>Your Impact</b></h2><p>Build the frontend platforms and frameworks that help engineering teams across Lowe\u2019s build better products, faster.</p><br /><p>As a Software Engineer on the Frameworks team, you\u2019ll work on platforms helping shape the tools and capabilities used by product teams across the enterprise. Your work will include building React components, improving framework capabilities and developer tooling, supporting micro-frontend capabilities, improving performance, and contributing to platform modernization.</p><br /><p>You\u2019ll take meaningful features from idea to delivery, solve real engineering problems, and help make the development experience better for teams across Lowe\u2019s.<br /><br /><b>What You Will Do</b></p><ul><li>Build and enhance frontend frameworks, developer platforms, and tooling used by engineering teams across Lowe\u2019s.</li><li>Develop React-based components and capabilities using modern JavaScript and frontend engineering practices.</li><li>Contribute to framework capabilities, micro-frontend architecture, developer tooling, performance improvements, and platform modernization.</li><li>Own medium-sized features and enhancements end-to-end, from understanding requirements through implementation, testing, and delivery.</li><li>Troubleshoot production and framework issues, identify root causes, and implement reliable solutions.</li><li>Write clean, maintainable code and automated tests while participating in code reviews and established engineering practices.</li><li>Work with CI/CD, observability, and other enterprise development tools and practices as part of the software delivery lifecycle.</li><li>Collaborate with engineers and cross-functional partners to understand problems, evaluate solutions, and deliver improvements.</li><li>Research and learn new technologies and approaches while contributing to a modern frontend engineering environment.<br /></li></ul><h2><b>Minimum Qualifications</b></h2><ul><li>Bachelor&#39;s degree in Computer Science, Computer Information Systems, or a related field, or equivalent years of experience in lieu of the education requirement, if applicable.</li><li><b>2 years of experience in software development or a related field.</b></li><li>Hands-on experience building software with <b>React and JavaScript</b>.</li><li>Strong understanding of frontend development fundamentals, including component-based development, debugging, testing, and writing maintainable code.</li><li>Experience working through the software development lifecycle in an iterative Agile environment.</li><li>Ability to take ownership of medium-sized features and enhancements, work through technical problems, and deliver with limited guidance.</li><li>Working knowledge of modern software engineering practices, including source control, CI/CD, testing, and secure development.</li><li>Ability to learn new technologies and frameworks and apply them to practical engineering problems.</li></ul><br /><h2><i>It&#39;s a plus if you have:</i></h2><ul><li>Experience with <b>TypeScript</b>.</li><li>Working knowledge of <b>Node.js</b> or other backend technologies.</li><li>Experience with micro-frontends, frontend frameworks, developer tooling, or platform engineering.</li><li>Experience with npm, package management, dependency management, or building reusable frontend components and libraries.</li><li>Experience with performance optimization, observability, or enterprise-scale applications.</li><li>Exp
