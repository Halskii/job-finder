<html><head><title>Software Engineer – WMS Integration and Reporting (Hybrid) | Publix Store &amp; Corporate Careers</title></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"fallback": {"#url:\"/wp-json/wp/v2/posts\",args:#slug:\"software-engineer-wms-integration-and-reporting-hybrid\",postType:@\"job_opening\",,/": {"result": {"slug": "software-engineer-wms-integration-and-reporting-hybrid", "date": "2026-11-02T11:07:03", "job_id": "39411BR", "title": {"rendered": "Software Engineer – WMS Integration and Reporting (Hybrid)"}, "content": {"rendered": "<div data-publix-block=\"true\" data-wp-block-name=\"publix/job-header\" data-wp-block='{\"job_id\":\"39411BR\",\"title\":\"Software Engineer &#8211; WMS Integration and Reporting (Hybrid)\",\"location\":\"Lakeland, FL\",\"job_category\":\"Information Technology\\/Systems\",\"department\":\"Publix Technology\",\"date_posted\":\"Nov 02, 2026\",\"pills\":[\"$90 - 135k\",\"Onsite\",\"Full Time - Regular\"],\"apply_url\":\"https:\\/\\/sjobs.brassring.com\\/TGnewUI\\/Search\\/home\\/HomeWithPreLoad?PageType=JobDetails&partnerid=26173&siteid=5197&jobid=1439946\",\"job_apply_label\":\"Apply\",\"working_hours\":\"\",\"pay_frequency\":\"Monthly\",\"pay_range\":\"$6,930 - $10,400\"}'></div>\n<h2 class=\"wp-block-heading has-color-1-color has-text-color\" data-wp-block-name=\"core/heading\" data-wp-block='{\"level\":2,\"textColor\":\"color-1\"}'>Description</h2>\n\n\n<p class=\"wp-block-paragraph\" data-wp-block-name=\"core/paragraph\" data-wp-block='{\"fontSize\":\"xs\",\"dropCap\":false}'>Publix Super Markets, Inc., the largest employee-owned company in the U.S., is driven by a dynamic technology team of 2,300+ professionals delivering innovative solutions to 1,400+ stores and 260,000+ associates across 8 states. </p><p>From IT security and platform engineering to architecture, software development, and infrastructure, we offer career opportunities at every level – internships through technical leadership. </p><p>Join a company consistently ranked among Fortune’s “100 Best </p><p>The Warehousing Modernization team is currently seeking a Software Engineer for modernizing Publix legacy warehousing systems. This key role involves participating in initiatives to modernize warehousing processes like receiving, integrating with other Warehousing Systems, and Reporting that currently supports our expanding distribution network, encompassing 9 Distribution Centers and 33 warehouses dedicated to servicing over 1200 retail stores.</p><p>Location: Hybrid (Lakeland, FL): To support our hybrid work model, candidates must reside, or be willing to relocate, within a commutable distance of Lakeland, FL. <br>Work Model: Enjoy the best of both worlds – collaborate in person and innovate remotely.  <br>Interview Process: Candidates selected to advance in the interview process will be required to participate in at least one onsite interview at our Lakeland, FL campus.</p><p>Why Join Us?</p><ul>\n<li>Hybrid Flexibility: Work remotely when you need focus time and join us onsite for high-impact collaboration and brainstorming sessions.</li>\n<li>Operational Efficiency: Ensure technology solutions support efficient workflows and enable automation to improve operational effectiveness.</li>\n<li>Cutting-Edge AI Projects: Drive innovation in AI platforms, integrating advanced tools and frameworks to solve complex business challenges.</li>\n<li>Empowered Culture: We value autonomy, creativity, and continuous learning—your ideas shape the future of technology in our organization.</li>\n</ul><p>Your impact:</p><ul>\n<li>Design and develop enterprise-grade technology solutions using modern methodologies (Agile and traditional) ensuring performance, scalability, stability, usability, and cross-system integration while leveraging CI/CD pipelines (e.g., Azure DevOps, GitHub, etc.).</li>\n<li>Analyze business and system requirements, user stories, and technical design artifacts to develop internal designs, program specifications, and product backlog items under guidance.</li>\n<li>Collaborate with Architecture and Technical Leads to ensure alignment with enterprise standards, best practices, and solution designs.</li>\n<li>Partner with Business Systems Analysts and Product Owners to validate business requirements and support solution delivery.</li>\n<li>Develop, maintain, and automate unit test plans, test scripts, and test cases to ensure application quality and reliability.</li>\n<li>Utilize development tools, including AI, and environments to efficiently code, unit test, debug, and manage application components throughout the development lifecycle.</li>\n<li>Create and maintain comprehensive technical documentation, including solution designs, program specifications, and testing results.</li>\n<li>Plan, coordinate, and support the deployment of technical solutions from testing environments to production under established guidance.</li>\n<li>Troubleshoot, analyze, and resolve moderately complex application and production issues, escalating when appropriate.</li>\n<li>Participate in on-call rotation to support production systems and ensure operational continuity.</li>\n</ul>"}}}}}}}</script></body></html>
