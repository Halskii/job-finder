# The app and the web server that gives it HTTPS. The database is separate (RDS), reached through DATABASE_URL.
# Variables come from the .env file next to this one (copy deploy/env.production.example to .env and fill it in).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ALLOWED_HOSTS: ${DOMAIN}
    volumes:
      - data:/app/data                                              # every user's files, and the crawl's memory
      - ./deploy/config.production.yaml:/app/config.yaml:ro         # the service-wide settings (models, limits, schedule)
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                                            # the certificates
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
